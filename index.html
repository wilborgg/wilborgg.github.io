<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Wilbert | Portfolio</title>
  <style>
    :root {
      --bg: #0d1117;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #3fb950;
      --border: #30363d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .prompt {
      font-family: ui-monospace, Consolas, monospace;
      color: var(--accent);
      margin-bottom: 16px;
    }
    .cursor {
      display: inline-block;
      width: 0.6em;
      background: var(--accent);
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    h1 { font-size: clamp(1.6rem, 5vw, 2.4rem); margin-bottom: 12px; }
    p { color: var(--muted); max-width: 460px; margin: 0 auto; line-height: 1.6; }
    .links {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .links a {
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .links a:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <p class="prompt">$ build portfolio<span class="cursor">&nbsp;</span></p>
    <h1>Portfolio under construction</h1>
    <p>Hi, I'm Wilbert, a Cyber Security student at BINUS University. My portfolio is being built. In the meantime, you can reach me here:</p>
    <div class="links">
      <a href="https://github.com/wilborgg">GitHub</a>
      <a href="https://linkedin.com/in/wilbertarchie">LinkedIn</a>
      <a href="mailto:wilbertarchiee@gmail.com">Email</a>
    </div>
  </main>
</body>
</html>
